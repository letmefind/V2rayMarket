# VPNMarket — یک نمونه (یک ربات / یک دامنه)
# چند نمونه روی یک سرور: deploy/README.md و deploy/instances/

name: ${COMPOSE_PROJECT_NAME:-vpnmarket}

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-vpnmarket-local:latest}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_HOST: mysql
      REDIS_HOST: redis
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      WAIT_FOR_DB: "true"
    volumes:
      - app_storage:/var/www/html/storage
      - ${ENV_FILE:-.env}:/var/www/html/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

  queue:
    image: ${APP_IMAGE:-vpnmarket-local:latest}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - app_storage:/var/www/html/storage
      - ${ENV_FILE:-.env}:/var/www/html/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    networks:
      - internal

  scheduler:
    image: ${APP_IMAGE:-vpnmarket-local:latest}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/var/www/html/storage
      - ${ENV_FILE:-.env}:/var/www/html/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    networks:
      - internal

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vpnmarket}
      MYSQL_USER: ${DB_USERNAME:-vpnmarket}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  app_storage:
  mysql_data:
  redis_data:

networks:
  internal:
    driver: bridge
