# پشت Traefik روی پورت 443 (شبکه proxy باید از قبل ساخته شده باشد)
services:
  web:
    ports: []
    networks:
      - internal
      - proxy
    environment:
      TRAEFIK_ENABLE: "true"
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.services.${TRAEFIK_ROUTER_NAME}.loadbalancer.server.port=80
      # HTTPS
      # هر دو apex و www — rule را در کوتیشن بگذارید تا YAML با || یا بکتیک مشکل نگیرد
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME}.entrypoints=websecure
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME}.tls=true
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME}.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      # صریح برای LE — اگر حذف شود گاهی فقط default cert دیده می‌شود تا وقتی SNI/صفحه هم‌خوان شود
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.tls.domains[0].main=${APP_DOMAIN}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.tls.domains[0].sans=www.${APP_DOMAIN}"
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME}.service=${TRAEFIK_ROUTER_NAME}
      # HTTP → HTTPS (بدون اولویت پایین، ریدایرکت روی :80 چالش ACME را می‌شکند → TRAEFIK DEFAULT CERT)
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-http.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME}-http.entrypoints=web
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME}-http.priority=1
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME}-http.service=${TRAEFIK_ROUTER_NAME}
      - traefik.http.routers.${TRAEFIK_ROUTER_NAME}-http.middlewares=${TRAEFIK_ROUTER_NAME}-redirect-https
      - traefik.http.middlewares.${TRAEFIK_ROUTER_NAME}-redirect-https.redirectscheme.scheme=https
      - traefik.http.middlewares.${TRAEFIK_ROUTER_NAME}-redirect-https.redirectscheme.permanent=true

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
