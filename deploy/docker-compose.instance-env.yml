# فقط mount فایل .env نمونه — env_file داکر با Laravel تداخل/override می‌سازد
services:
  web:
    env_file: !reset null
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ${INSTANCE_ENV_FILE:?set INSTANCE_ENV_FILE}:/var/www/html/.env:ro

  queue:
    env_file: !reset null
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ${INSTANCE_ENV_FILE:?}:/var/www/html/.env:ro

  scheduler:
    env_file: !reset null
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ${INSTANCE_ENV_FILE:?}:/var/www/html/.env:ro
