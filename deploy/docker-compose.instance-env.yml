# هر نمونه .env خودش را دارد — جایگزین کامل env_file/volume ریشهٔ پروژه
services:
  web:
    env_file: !reset
      - ${INSTANCE_ENV_FILE:?set INSTANCE_ENV_FILE}
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ${INSTANCE_ENV_FILE:?}:/var/www/html/.env:ro

  queue:
    env_file: !reset
      - ${INSTANCE_ENV_FILE:?}
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ${INSTANCE_ENV_FILE:?}:/var/www/html/.env:ro

  scheduler:
    env_file: !reset
      - ${INSTANCE_ENV_FILE:?}
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ${INSTANCE_ENV_FILE:?}:/var/www/html/.env:ro
