# یک‌بار روی سرور: reverse proxy مشترک برای همهٔ نمونه‌های ربات (پورت 80/443)
name: traefik

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme/acme.json
    networks:
      - proxy

networks:
  # شبکهٔ proxy ممکن است قبلاً با `docker network create proxy` ساخته شده باشد
  proxy:
    external: true
    name: proxy
