# یک‌بار روی سرور: reverse proxy مشترک برای همهٔ نمونه‌های ربات (پورت 80/443)
name: traefik

services:
  traefik:
    # نسخهٔ قدیمی‌تر با سوکت Docker گاهی API 1.24 می‌فرستد و روی Docker جدید providers قطع می‌شود → همه‌چیز 404
    image: traefik:v3.7
    restart: unless-stopped
    labels:
      - vpnmarket.shared_traefik=true
    env_file:
      - .env
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # ریدایرکت HTTP→HTTPS فقط روی router هر دامنه است (در docker-compose.traefik.yml)
      # ریدایرکت سراسری اینجا ACME http-01 را خراب می‌کند
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme/acme.json
    networks:
      - proxy

networks:
  # شبکهٔ proxy ممکن است قبلاً با `docker network create proxy` ساخته شده باشد
  proxy:
    external: true
    name: proxy
