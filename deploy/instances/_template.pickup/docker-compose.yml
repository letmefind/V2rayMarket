# مسیر ./.env نسبت به همین پوشه (deploy/instances/<domain>/) است
services:
  web:
    env_file: !reset null
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ./.env:/run/instance.env:ro

networks:
  shared_data:
    external: true
    name: ${SHARED_DATA_NETWORK:-vpnmarket_shared_data}
