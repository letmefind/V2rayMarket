# ENV_FILE / INSTANCE_ENV_FILE = مسیر مطلق .env نمونه (در خود .env یا export قبل از compose)
services:
  web:
    env_file: !reset null
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ${ENV_FILE}:/run/instance.env:ro

networks:
  shared_data:
    external: true
    name: ${SHARED_DATA_NETWORK:-vpnmarket_shared_data}
