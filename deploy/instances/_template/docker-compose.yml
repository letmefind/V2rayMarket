services:
  web:
    env_file: !reset null
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ./.env:/run/instance.env:ro

  queue:
    env_file: !reset null
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ./.env:/run/instance.env:ro

  scheduler:
    env_file: !reset null
    volumes: !reset
      - app_storage:/var/www/html/storage
      - ./.env:/run/instance.env:ro
